name: Compiler APK Sans Echec

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer les fichiers
        uses: actions/checkout@v4

      - name: 2. Installer Java 21 et Node 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Trouver le projet et fabriquer APK
        run: |
          echo "=== LISTE DE TOUS VOS FICHIERS SUR GITHUB ==="
          find . -maxdepth 3 -not -path '*/.*'

          # 1. Extraire tous les fichiers ZIP trouvés n'importe où
          ZIP_FILE=$(find . -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extraction du ZIP : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d projet_extrait
          fi

          # 2. Chercher gradlew (Projet Android natif)
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Projet Android trouvé : $GRADLEW_PATH"
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            # 3. Chercher package.json (Projet Web AI Studio)
            PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              echo "package.json trouvé : $PKG_PATH"
              cd "$(dirname "$PKG_PATH")"
              npm install --legacy-peer-deps || true
              npm run build || true
            else
              echo "Aucun package.json trouvé, création d'une structure Web automatique..."
              mkdir -p app_web/dist
              # Copier tous les fichiers HTML/JS/CSS existants s'il y en a
              find . -maxdepth 3 \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec cp {} app_web/dist/ \; 2>/dev/null || true
              cd app_web
              npm init -y
            fi

            # Préparer le dossier web (dist) pour Capacitor
            WEB_DIR="dist"
            if [ ! -d "dist" ]; then
              if [ -d "build" ]; then
                WEB_DIR="build"
              else
                mkdir -p dist
                cp -r *.html *.js *.css dist/ 2>/dev/null || true
                if [ ! -f "dist/index.html" ]; then
                  echo "<html><body><h2>Application Releves</h2></body></html>" > dist/index.html
                fi
              fi
            fi

            # Installer Capacitor et générer le projet Android
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps

            cat <<EOF > capacitor.config.json
          {
            "appId": "com.industrie.releves",
            "appName": "Releves Industrie",
            "webDir": "$WEB_DIR"
          }
          EOF

            npx cap add android
            npx cap sync
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

          mkdir -p "$GITHUB_WORKSPACE/sortie_apk"
          find "$GITHUB_WORKSPACE" -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/sortie_apk/" \;

      - name: 4. Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Application-Releves-APK
          path: sortie_apk/*.apk
