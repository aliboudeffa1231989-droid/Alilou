name: Compiler APK Final

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer les fichiers
        uses: actions/checkout@v4

      - name: 2. Installer Java 21 et Node 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Fabriquer APK
        run: |
          # Extraire le ZIP s'il est présent
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d projet_extrait
            cd projet_extrait
          fi

          # Vérifier si c'est déjà un projet Android natif
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # Sinon, c'est un projet Web AI Studio
            PKG_PATH=$(find . -name "package.json" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              cd "$(dirname "$PKG_PATH")"
            fi
            
            npm install --legacy-peer-deps
            npm run build

            # Trouver où le dossier web a été généré
            WEB_DIR="dist"
            if [ ! -d "dist" ]; then
              if [ -d "build" ]; then WEB_DIR="build"; else mkdir -p dist && cp -r *.html *.js *.css dist/ 2>/dev/null || true; fi
            fi

            # Installer Capacitor avec Java 21
            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps

            cat <<EOF > capacitor.config.json
          {
            "appId": "com.industrie.releves",
            "appName": "Releves Industrie",
            "webDir": "$WEB_DIR"
          }
          EOF

            npx cap add android
            npx cap sync
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

          mkdir -p "$GITHUB_WORKSPACE/sortie_apk"
          find "$GITHUB_WORKSPACE" -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/sortie_apk/" \;

      - name: 4. Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Application-Releves-APK
          path: sortie_apk/*.apk

          

          
