name: Compiler APK Direct

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer les fichiers
        uses: actions/checkout@v4

      - name: 2. Installer Java 21 et Node 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Fabriquer APK
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d projet_extrait
          fi

          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              cd "$(dirname "$PKG_PATH")"
              npm install --legacy-peer-deps || true
              npm run build || true
            else
              mkdir -p app_web/dist
              find . -maxdepth 3 -name "*.html" -exec cp {} app_web/dist/ \; 2>/dev/null || true
              cd app_web
              npm init -y
            fi

            WEB_DIR="dist"
            if [ ! -d "dist" ]; then
              if [ -d "build" ]; then
                WEB_DIR="build"
              else
                mkdir -p dist
                cp *.html *.js *.css dist/ 2>/dev/null || true
                if [ ! -f "dist/index.html" ]; then
                  echo "<html><body><h1>Releves Industrie</h1></body></html>" > dist/index.html
                fi
              fi
            fi

            npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
            echo '{"appId":"com.industrie.releves","appName":"Releves","webDir":"'"$WEB_DIR"'"}' > capacitor.config.json
            npx cap add android
            npx cap sync
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

          mkdir -p "$GITHUB_WORKSPACE/sortie_apk"
          find "$GITHUB_WORKSPACE" -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/sortie_apk/" \;

      - name: 4. Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Application-Releves-APK
          path: sortie_apk/*.apk
          
