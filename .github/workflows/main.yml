name: Compiler APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decompresser et Compiler APK
        run: |
          echo "Fichiers présents dans votre GitHub :"
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extraction du fichier : $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d app_extrait
          fi
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERREUR : Aucun projet Android (gradlew) trouvé !"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/sortie_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/sortie_apk/" \;

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Application-Releves-APK
          path: sortie_apk/*.apk

          
